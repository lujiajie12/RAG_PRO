[project]
name = "contextpilot-backend"
version = "0.1.0"
description = "Flask backend scaffold for a RAG + Agent + Memory knowledge assistant."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4.0",
  "Flask-Cors>=5.0,<6.0",
  "Flask-Migrate>=4.0,<5.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "minio>=7.2,<8.0",
  "langchain>=1.2,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=0.3,<1.0",
  "langchain-community>=0.3,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-flask>=1.3,<2.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
